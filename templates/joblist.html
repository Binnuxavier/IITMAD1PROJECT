<!DOCTYPE html>
<html>
<head>
    <title>Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-danger mb-4">Available Jobs</h2>

    <table class="table table-bordered shadow">
        <tr>
            <th>Job ID</th>
            <th>Role</th>
            <th>Salary</th>
            <th>Location</th>
            <th>Action</th>
        </tr>

        {% for job in jobs %}
        <tr>
            <td>{{ job[0] }}</td>
            <td>{{ job[2] }}</td>
            <td>{{ job[3] }}</td>
            <td>{{ job[4] }}</td>
            <td>
                <a href="/job/apply/{{ job[0] }}" class="btn btn-danger btn-sm">Apply</a>
            </td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
