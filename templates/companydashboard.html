<!DOCTYPE html>
<html>
<head>
    <title>Company Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <h2 class="text-danger text-center mb-3">Company Dashboard</h2>

            <div class="text-center mb-4">
                <p class="mb-1"><strong>Company ID:</strong> {{ company_id }}</p>
                <p class="mb-1"><strong>Company Name:</strong> {{ company_name }}</p>
                <p class="mb-0"><strong>Email:</strong> {{ email_id }}</p>
            </div>

            <div class="card shadow p-4 rounded-4">
                <h4 class="mb-4 text-center">Actions</h4>

                <a href="/job/post" class="btn btn-danger w-100 mb-3">Post Job</a>
                <a href="/company/applications" class="btn btn-outline-danger w-100 mb-3">View Applications</a>
                <a href="/company/logout" class="btn btn-secondary w-100">Logout</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
