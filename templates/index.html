<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-danger">Placement Portal</h1>
            <p class="text-muted">Student - Company - Admin Placement Management System</p>
        </div>

        <div class="row justify-content-center g-4">
            
            <!-- Student -->
            <div class="col-md-4">
                <div class="card shadow-sm p-4 text-center rounded-4">
                    <h3 class="mb-4 text-danger">Student</h3>
                    <a href="/student/register" class="btn btn-danger mb-3">Register</a>
                    <a href="/student/login" class="btn btn-outline-danger">Login</a>
                </div>
            </div>

            <!-- Company -->
            <div class="col-md-4">
                <div class="card shadow-sm p-4 text-center rounded-4">
                    <h3 class="mb-4 text-danger">Company</h3>
                    <a href="/company/register" class="btn btn-danger mb-3">Register</a>
                    <a href="/company/login" class="btn btn-outline-danger">Login</a>
                </div>
            </div>

            <!-- Admin -->
            <div class="col-md-4">
                <div class="card shadow-sm p-4 text-center rounded-4">
                    <h3 class="mb-4 text-danger">Admin</h3>
                    <a href="/admin/login" class="btn btn-danger">Admin Login</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
