<!DOCTYPE html>
<html>
<head>
    <title>Application Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-danger mb-4">My Application Status</h2>

    <table class="table table-bordered shadow bg-white">
        <tr>
            <th>Application ID</th>
            <th>Job ID</th>
            <th>Status</th>
        </tr>

        {% for app in applications %}
        <tr>
            <td>{{ app[0] }}</td>
            <td>{{ app[2] }}</td>
            <td>{{ app[3] }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/student/dashboard" class="btn btn-secondary mt-3">Back</a>
</div>

</body>
</html>
