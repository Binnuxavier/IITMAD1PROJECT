<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4 rounded-4">
                <h2 class="text-center text-danger mb-4">Company Registration</h2>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" name="company_name" class="form-control" value="{{ company_name or '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="text" name="mobile_number" class="form-control"
                               value="{{ mobile_number or '' }}" maxlength="10" required
                               oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email ID</label>
                        <input type="email" name="email_id" class="form-control" value="{{ email_id or '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                        <div class="form-text">
                            Must contain uppercase, lowercase, number and special character.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-danger w-100">Register</button>
                </form>

                <div class="text-center mt-3">
                    <a href="/" class="text-danger">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
