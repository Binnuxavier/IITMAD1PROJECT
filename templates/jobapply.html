<!DOCTYPE html>
<html>
<head>
    <title>Apply for Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-danger mb-4">Available Jobs</h2>

    <table class="table table-bordered shadow bg-white">
        <tr>
            <th>Job ID</th>
            <th>Role</th>
            <th>Salary</th>
            <th>Location</th>
            <th>Expiry Date</th>
            <th>Action</th>
        </tr>

        {% for job in jobs %}
        <tr>
            <td>{{ job[0] }}</td>
            <td>{{ job[2] }}</td>
            <td>{{ job[3] }}</td>
            <td>{{ job[4] }}</td>
            <td>{{ job[5] }}</td>
            <td>
                <form method="POST">
                    <input type="hidden" name="job_id" value="{{ job[0] }}">
                    <button type="submit" class="btn btn-danger btn-sm">Apply</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <a href="/student/dashboard" class="btn btn-secondary mt-3">Back</a>
</div>

</body>
</html>
