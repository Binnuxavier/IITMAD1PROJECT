<!DOCTYPE html>
<html>
<head>
    <title>Job Posting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow p-4 rounded-4">
                <h2 class="text-danger mb-4 text-center">Post Job</h2>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label>Job Role</label>
                        <input type="text" name="job_role" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Salary</label>
                        <input type="text" name="salary" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Location</label>
                        <input type="text" name="location" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Expiry Date</label>
                        <input type="date" name="expiry_date" class="form-control" required min="{{ today }}">
                    </div>

                    <button class="btn btn-danger w-100">Post Job</button>
                </form>
<div class="mt-3">
    <a href="/company/dashboard" class="btn btn-secondary">
        ← Back to Dashboard
    </a>
</div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
